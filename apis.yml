aid: edgefolio
name: Edgefolio
description: >-
  Edgefolio is a London-based financial technology company providing a digital
  capital-raising and fund-marketing platform for the hedge fund industry. Its
  SaaS products connect hedge funds, prime brokers, and institutional investors:
  Edgefolio for Managers offers a secure data-room and CRM for fund managers to
  control their data, manage investor relationships, and collaborate; Edgefolio
  for Prime Brokers delivers capital introduction and consulting tooling for cap
  intro teams; and Edgefolio for Investors is a fund screening and research
  platform with integrated market data. Surfaced as a portfolio company of
  Seedcamp. As of this enrichment pass Edgefolio publishes no public API,
  developer portal, OpenAPI specification, or SDKs — the platform is delivered
  as a private B2B application accessed via demo and client login.
